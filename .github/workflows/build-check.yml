name: Build check

# The gate the TestFlight workflows are not: those only run after a merge
# reaches main, so until this existed the first sign that a pull request
# did not compile was a failed release upload on main. Builds both
# platforms and reports pass/fail on the pull request itself.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the branch makes the in-flight check irrelevant, unlike
# the distribution workflows where a cancelled run could strand a build
# number.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: src/WiggleRoom.xcodeproj
  SCHEME: WiggleRoom

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # GitHub's Xcode 27 image (a public preview); macos-latest stops at
    # Xcode 26. See .github/scripts/check-xcode.sh.
    runs-on: xcode-27
    timeout-minutes: 45

    strategy:
      # Both platforms report independently: one failing should not hide
      # whether the other also broke.
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
          - platform: macOS
            destination: platform=macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Xcode version
        run: .github/scripts/check-xcode.sh

      - name: Build ${{ matrix.platform }}
        run: |
          # Release, to match what the distribution workflows archive, so
          # this catches anything that only fails under release settings.
          # Unsigned deliberately: no secrets are needed, which keeps the
          # check working on pull requests from forks and from agents.
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO

  cloudkit-schema:
    name: Check models against the committed CloudKit schema
    # GitHub's Xcode 27 image (a public preview); macos-latest stops at
    # Xcode 26. See .github/scripts/check-xcode.sh.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Xcode version
        run: .github/scripts/check-xcode.sh

      - name: Pick an iOS Simulator
        run: |
          # Asks Xcode which Simulators it will accept for this scheme,
          # rather than guessing from simctl, then takes the newest iPhone.
          SIMULATOR_ID="$(xcodebuild -showdestinations \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            | python3 -c '
          import re, sys
          simulators = [
              (tuple(int(part) for part in match["os"].split(".")), match["id"])
              for match in re.finditer(
                  r"platform:iOS Simulator, (?:arch:[^,]+, )?id:(?P<id>[0-9A-F-]{36}), OS:(?P<os>[0-9.]+), name:iPhone",
                  sys.stdin.read(),
              )
          ]
          print(max(simulators)[1] if simulators else "")
          ')"
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "::error title=CloudKit schema check::Xcode offers no iPhone Simulator for the $SCHEME scheme on this runner."
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run CloudKitSchemaTests
        run: |
          # Fails when a SwiftData model has a field cloudkit/schema.ckdb
          # lacks, so a model change can't merge without the schema file the
          # TestFlight workflows check Production against. Needs no secrets:
          # a Simulator build signs itself locally, with no account.
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:WiggleRoomTests/CloudKitSchemaTests

  schema-deploy-reminder:
    name: Remind to deploy CloudKit schema changes
    # Needs no Xcode, and posts nothing unless the pull request changes
    # cloudkit/schema.ckdb. A Production deploy is only possible in CloudKit
    # Console, so this comment is the nudge to do it before TestFlight.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Post or clear the reminder comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- cloudkit-schema-deploy -->'
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")"
          if gh pr diff "$PR" --name-only | grep -qx 'cloudkit/schema.ckdb'; then
            if [[ -n "$comment_id" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
                -F body=@.github/schema-deploy-comment.md > /dev/null
            else
              gh pr comment "$PR" --body-file .github/schema-deploy-comment.md
            fi
          elif [[ -n "$comment_id" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
          fi
