name: Build check

# The gate the TestFlight workflows are not: those only run after a merge
# reaches main, so until this existed the first sign that a pull request
# did not compile was a failed release upload on main. Builds both
# platforms and reports pass/fail on the pull request itself.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the branch makes the in-flight check irrelevant, unlike
# the distribution workflows where a cancelled run could strand a build
# number.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: src/WiggleRoom.xcodeproj
  SCHEME: WiggleRoom

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-latest
    timeout-minutes: 45

    strategy:
      # Both platforms report independently: one failing should not hide
      # whether the other also broke.
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
          - platform: macOS
            destination: platform=macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ${{ matrix.platform }}
        run: |
          # Release, to match what the distribution workflows archive, so
          # this catches anything that only fails under release settings.
          # Unsigned deliberately: no secrets are needed, which keeps the
          # check working on pull requests from forks and from agents.
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO

  cloudkit-schema:
    name: Check models against the committed CloudKit schema
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select the newest Xcode
        run: |
          # Unlike a build, a test run needs a Simulator the selected Xcode
          # can run for the project's deployment target, so take the newest
          # Xcode the runner image has rather than its default.
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version

      - name: Pick an iOS Simulator
        run: |
          # If the runner's newest Xcode is still older than the project's
          # iOS deployment target, no Simulator is eligible for it. The build
          # jobs above only warn in that case, but a test run fails outright.
          # This test only reads the model schema, so it runs at the newest
          # iOS the runner's Xcode has instead.
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          TARGET_VERSION="$(grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*' "$PROJECT_PATH/project.pbxproj" \
            | awk '{ print $3 }' | sort -V | tail -n 1)"
          if [[ "$(printf '%s\n' "$SDK_VERSION" "$TARGET_VERSION" | sort -V | head -n 1)" != "$TARGET_VERSION" ]]; then
            echo "::warning title=CloudKit schema check::Xcode's newest iOS Simulator SDK is $SDK_VERSION, older than the project's deployment target $TARGET_VERSION. Running the test at iOS $SDK_VERSION."
            echo "DEPLOYMENT_TARGET_OVERRIDE=IPHONEOS_DEPLOYMENT_TARGET=$SDK_VERSION" >> "$GITHUB_ENV"
            OVERRIDE="IPHONEOS_DEPLOYMENT_TARGET=$SDK_VERSION"
          fi

          # Asks Xcode which Simulators it will accept for this scheme,
          # rather than guessing from simctl, then takes the newest iPhone.
          SIMULATOR_ID="$(xcodebuild -showdestinations \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            ${OVERRIDE:+"$OVERRIDE"} \
            | python3 -c '
          import re, sys
          simulators = [
              (tuple(int(part) for part in match["os"].split(".")), match["id"])
              for match in re.finditer(
                  r"platform:iOS Simulator, (?:arch:[^,]+, )?id:(?P<id>[0-9A-F-]{36}), OS:(?P<os>[0-9.]+), name:iPhone",
                  sys.stdin.read(),
              )
          ]
          print(max(simulators)[1] if simulators else "")
          ')"
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "::error title=CloudKit schema check::Xcode offers no iPhone Simulator for the $SCHEME scheme on this runner."
            exit 1
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run CloudKitSchemaTests
        run: |
          # Fails when a SwiftData model has a field cloudkit/schema.ckdb
          # lacks, so a model change can't merge without the schema file the
          # TestFlight workflows check Production against. Needs no secrets:
          # a Simulator build signs itself locally, with no account.
          xcodebuild test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:WiggleRoomTests/CloudKitSchemaTests \
            ${DEPLOYMENT_TARGET_OVERRIDE:+"$DEPLOYMENT_TARGET_OVERRIDE"}
