name: Distribute macOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testflight-macos
  cancel-in-progress: false

env:
  PROJECT_PATH: src/WiggleRoom.xcodeproj
  SCHEME: WiggleRoom

jobs:
  distribute:
    name: Archive and upload macOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set build number
        run: |
          # Reserve lower build numbers for archives produced outside GitHub Actions.
          # GitHub's workflow run number is monotonic, unlike commit counts after squash merges.
          # The final component distinguishes iOS (1) from macOS (2).
          echo "BUILD_NUMBER=$((2000 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}.2" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          umask 077
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$API_PRIVATE_KEY" > "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install macOS distribution certificates
        env:
          APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          APP_CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          INSTALLER_CERTIFICATE_PATH="$RUNNER_TEMP/mac-installer-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          ORIGINAL_KEYCHAINS_PATH="$RUNNER_TEMP/original-keychains"
          PRODUCTBUILD_PATH="$(xcrun --find productbuild)"
          PRODUCTSIGN_PATH="$(xcrun --find productsign)"

          umask 077
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' \
            > "$ORIGINAL_KEYCHAINS_PATH"
          if ! printf '%s' "$APP_CERTIFICATE_BASE64" | openssl base64 -d -A > "$APP_CERTIFICATE_PATH" \
            || [[ ! -s "$APP_CERTIFICATE_PATH" ]]; then
            echo "::error::APPLE_DISTRIBUTION_CERTIFICATE_BASE64 is empty or is not valid Base64 for a .p12 file."
            exit 1
          fi
          if ! printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | openssl base64 -d -A > "$INSTALLER_CERTIFICATE_PATH" \
            || [[ ! -s "$INSTALLER_CERTIFICATE_PATH" ]]; then
            echo "::error::MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 is empty or is not valid Base64 for a .p12 file."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if ! security import "$APP_CERTIFICATE_PATH" \
            -P "$APP_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"; then
            echo "::error::Apple Distribution certificate import failed. Verify that the Base64 secret contains the password-protected .p12 with its private key and that the password secret is the .p12 export password."
            exit 1
          fi
          if ! security import "$INSTALLER_CERTIFICATE_PATH" \
            -P "$INSTALLER_CERTIFICATE_PASSWORD" \
            -T "$PRODUCTBUILD_PATH" \
            -T "$PRODUCTSIGN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"; then
            echo "::error::Mac Installer Distribution certificate import failed. Verify that the Base64 secret contains the password-protected .p12 with its private key and that the password secret is the .p12 export password."
            exit 1
          fi
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            ORIGINAL_KEYCHAINS+=("$keychain")
          done < "$ORIGINAL_KEYCHAINS_PATH"
          if (( ${#ORIGINAL_KEYCHAINS[@]} > 0 )); then
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          fi

          INSTALLER_CERTIFICATE_SHA1=""
          for certificate_name in "3rd Party Mac Developer Installer" "Mac Installer Distribution"; do
            INSTALLER_CERTIFICATE_SHA1="$(
              security find-certificate -a -c "$certificate_name" -Z "$KEYCHAIN_PATH" 2>/dev/null \
                | awk '/SHA-1 hash:/{print $3; exit}'
            )"
            [[ -n "$INSTALLER_CERTIFICATE_SHA1" ]] && break
          done
          if [[ -z "$INSTALLER_CERTIFICATE_SHA1" ]]; then
            echo "::error::The imported installer .p12 does not contain a Mac Installer Distribution certificate. Keychain may display this certificate as '3rd Party Mac Developer Installer'."
            exit 1
          fi
          echo "INSTALLER_CERTIFICATE_SHA1=$INSTALLER_CERTIFICATE_SHA1" >> "$GITHUB_ENV"
          echo "Mac installer distribution certificate is available for export."

      - name: Install Mac App Store provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.MAC_WIDGET_APP_STORE_PROFILE_BASE64 }}
        run: |
          PROFILE_DIRECTORY="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIRECTORY"

          install_profile() {
            local encoded_profile="$1"
            local expected_bundle_id="$2"
            local environment_name="$3"
            local profile_path="$PROFILE_DIRECTORY/${environment_name}.provisionprofile"
            local profile_plist="$RUNNER_TEMP/${environment_name}.plist"

            if ! printf '%s' "$encoded_profile" | openssl base64 -d -A > "$profile_path" \
              || [[ ! -s "$profile_path" ]] \
              || ! security cms -D -i "$profile_path" > "$profile_plist"; then
              echo "::error::Provisioning profile secret for ${expected_bundle_id} is empty, invalid, or not Base64 for a provisioning profile."
              exit 1
            fi

            local profile_uuid
            local profile_app_identifier
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
            profile_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile_plist")"
            if [[ "$profile_app_identifier" != *".${expected_bundle_id}" ]]; then
              echo "::error::Provisioning profile ${profile_uuid} is for ${profile_app_identifier}, not ${expected_bundle_id}."
              exit 1
            fi

            mv "$profile_path" "$PROFILE_DIRECTORY/${profile_uuid}.provisionprofile"
            echo "${environment_name}=${profile_uuid}" >> "$GITHUB_ENV"
          }

          install_profile "$APP_PROFILE_BASE64" "martinkearn.WiggleRoom" "MAC_APP_PROFILE_UUID"
          install_profile "$WIDGET_PROFILE_BASE64" "martinkearn.WiggleRoom.WiggleRoomWidgets" "MAC_WIDGET_PROFILE_UUID"

      - name: Archive macOS app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/WiggleRoom-macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Write TestFlight test notes
        run: |
          # App Store Connect reads TestFlight/WhatToTest.<locale>.txt from
          # inside the archive and shows it to testers as "What to Test"
          # against this build, so a tester can see which change they are
          # actually holding. Taken from git rather than
          # github.event.head_commit, which is null for workflow_dispatch.
          NOTES_DIRECTORY="$RUNNER_TEMP/WiggleRoom-macOS.xcarchive/TestFlight"
          mkdir -p "$NOTES_DIRECTORY"
          {
            git log -1 --pretty=%B
            printf 'Commit %s on %s\n' "$(git rev-parse --short HEAD)" "$GITHUB_REF_NAME"
            printf 'Pipeline run #%s\n' "$GITHUB_RUN_NUMBER"
            printf '%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/what-to-test.txt"
          # The field caps at 4000 characters. Truncate on a character
          # boundary — cutting bytes could split a multi-byte character and
          # leave invalid UTF-8 in the upload.
          python3 -c 'import pathlib, sys; source, destination = sys.argv[1:3]; pathlib.Path(destination).write_text(pathlib.Path(source).read_text()[:4000])' \
            "$RUNNER_TEMP/what-to-test.txt" "$NOTES_DIRECTORY/WhatToTest.en-US.txt"
          # Echoed so a failed pickup can be told apart from a bad file.
          echo "What to Test:"
          cat "$NOTES_DIRECTORY/WhatToTest.en-US.txt"

      - name: Upload macOS archive to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-macOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>installerSigningCertificate</key>
            <string>${INSTALLER_CERTIFICATE_SHA1}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>martinkearn.WiggleRoom</key>
              <string>${MAC_APP_PROFILE_UUID}</string>
              <key>martinkearn.WiggleRoom.WiggleRoomWidgets</key>
              <string>${MAC_WIDGET_PROFILE_UUID}</string>
            </dict>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WiggleRoom-macOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/WiggleRoom-macOS-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-macOS.plist" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Remove signing material
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -f "$RUNNER_TEMP/original-keychains" ]]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r keychain; do
              ORIGINAL_KEYCHAINS+=("$keychain")
            done < "$RUNNER_TEMP/original-keychains"
            if (( ${#ORIGINAL_KEYCHAINS[@]} > 0 )); then
              security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}"
            else
              security list-keychains -d user -s
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/original-keychains" \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/mac-installer-distribution.p12" \
            "$RUNNER_TEMP/"MAC_*_PROFILE_UUID.plist \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${MAC_APP_PROFILE_UUID:-missing}.provisionprofile" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${MAC_WIDGET_PROFILE_UUID:-missing}.provisionprofile" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
