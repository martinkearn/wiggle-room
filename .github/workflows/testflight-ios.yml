name: Distribute iOS to TestFlight

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testflight-ios
  cancel-in-progress: false

env:
  PROJECT_PATH: src/WiggleRoom.xcodeproj
  SCHEME: WiggleRoom

jobs:
  distribute:
    name: Archive and upload iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set build number
        run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$API_PRIVATE_KEY" > "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install Apple distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          ORIGINAL_KEYCHAINS_PATH="$RUNNER_TEMP/original-keychains"
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' \
            > "$ORIGINAL_KEYCHAINS_PATH"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            ORIGINAL_KEYCHAINS+=("$keychain")
          done < "$ORIGINAL_KEYCHAINS_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"

      - name: Archive iOS app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WiggleRoom-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Upload iOS archive to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WiggleRoom-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/WiggleRoom-iOS-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Remove signing material
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [[ -f "$RUNNER_TEMP/original-keychains" ]]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r keychain; do
              ORIGINAL_KEYCHAINS+=("$keychain")
            done < "$RUNNER_TEMP/original-keychains"
            if (( ${#ORIGINAL_KEYCHAINS[@]} > 0 )); then
              security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}"
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/original-keychains" \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
